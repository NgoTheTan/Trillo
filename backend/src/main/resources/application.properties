spring.application.name=trillo

spring.datasource.url=jdbc:postgresql://localhost:5432/trillo_db
spring.datasource.username=postgres
spring.datasource.password=tan1042005
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

app.jwt.secret=trillo-super-secret-key-that-should-be-changed-in-production-2024!
